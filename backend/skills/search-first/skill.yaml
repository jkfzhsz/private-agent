name: search-first
version: "1.0.0"
description: "先搜索再动手：在实现任何功能前，搜索全网（GitHub/npm/PyPI/技能市场）是否已有现成方案"
scenario: meta
author: "reasonix-community"
created_at: "2026-08-08"
enabled: true
model_scope: ["deepseek"]

dependencies:
  tools:
    - name: web_search
      safety_level_override: safe
    - name: http_request
      safety_level_override: elevated

permissions:
  allow_file_write: false
  allow_network: true
  sandbox_enabled: true
  max_file_size_mb: 50

knowledge_base:
  enabled: false
  scenario: meta
  auto_retrieve: false

examples:
  enabled: false
  max_examples: 0
  inject_to: frozen_zone

max_frozen_token: 4000

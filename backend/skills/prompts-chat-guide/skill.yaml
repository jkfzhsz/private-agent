name: prompts-chat-guide
version: "1.0.0"
description: "prompts.chat MCP 使用指南：知道何时调用 prompts.chat 获取 Prompt 模板辅助写作，包含写作相关重点类别和与本地技能的组合策略。"
scenario: meta
author: "reasonix-community"
created_at: "2026-08-08"
enabled: true
model_scope: ["deepseek"]

dependencies:
  tools:
    - name: web_search
      safety_level_override: safe
    - name: http_request
      safety_level_override: elevated

permissions:
  allow_file_write: false
  allow_network: true
  sandbox_enabled: true
  max_file_size_mb: 50

knowledge_base:
  enabled: false
  scenario: meta
  auto_retrieve: false

examples:
  enabled: false
  max_examples: 0
  inject_to: frozen_zone

max_frozen_token: 4000

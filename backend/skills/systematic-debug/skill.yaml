name: systematic-debug
version: "1.0.0"
description: "系统化调试：四阶段根因分析（重现→诊断→修复→预防），强制 TDD 接入"
scenario: engineering
author: "reasonix-community"
created_at: "2026-08-08"
enabled: true
model_scope: ["deepseek"]

dependencies:
  tools:
    - name: code_execution
      safety_level_override: elevated
    - name: file_read
      safety_level_override: safe
    - name: file_write
      safety_level_override: elevated

permissions:
  allow_file_write: true
  allow_network: false
  sandbox_enabled: true
  max_file_size_mb: 50

knowledge_base:
  enabled: false
  scenario: engineering
  auto_retrieve: false

examples:
  enabled: false
  max_examples: 0
  inject_to: frozen_zone

max_frozen_token: 4000

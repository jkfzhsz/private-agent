name: duan-nian-jian
version: "1.0.0"
description: "《断念剑》小说创作完整工作流：工程化5模块+分层Prompt+角色声纹+情绪视觉化+网文风规范+四步流程+常见问题速查。写每一章前必调用。"
scenario: writing
author: "reasonix-community"
created_at: "2026-08-08"
enabled: true
model_scope: ["deepseek"]

dependencies:
  tools:
    - name: code_execution
      safety_level_override: safe
    - name: file_read
      safety_level_override: safe
    - name: file_write
      safety_level_override: elevated

permissions:
  allow_file_write: true
  allow_network: false
  sandbox_enabled: true
  max_file_size_mb: 50

knowledge_base:
  enabled: false
  scenario: writing
  auto_retrieve: false

examples:
  enabled: false
  max_examples: 0
  inject_to: frozen_zone

max_frozen_token: 4000

name: xlsx
version: "1.0.0"
description: "Excel生成：使用 openpyxl 创建 .xlsx 电子表格，支持样式/公式/图表/条件格式/多Sheet/冻结窗格/自动筛选，含专业报表配色和常用功能速查。"
scenario: documents
author: "reasonix-community"
created_at: "2026-08-08"
enabled: true
model_scope: ["deepseek"]

dependencies:
  tools:
    - name: code_execution
      safety_level_override: safe
    - name: file_read
      safety_level_override: safe
    - name: file_write
      safety_level_override: elevated

permissions:
  allow_file_write: true
  allow_network: true
  sandbox_enabled: true
  max_file_size_mb: 50

knowledge_base:
  enabled: false
  scenario: documents
  auto_retrieve: false

examples:
  enabled: false
  max_examples: 0
  inject_to: frozen_zone

max_frozen_token: 4000

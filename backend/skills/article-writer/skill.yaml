name: article-writer
version: "1.0.0"
description: "文章/博客写作专家：选题定位、结构化大纲（SCQA/PREP/金字塔）、开头钩子、正文展开、结尾收束、语言打磨、SEO优化。覆盖技术文章、观点评论、教程、叙事类等多种体裁。"
scenario: writing
author: "reasonix-community"
created_at: "2026-08-08"
enabled: true
model_scope: ["deepseek"]

dependencies:
  tools:
    - name: code_execution
      safety_level_override: safe
    - name: file_read
      safety_level_override: safe
    - name: file_write
      safety_level_override: elevated

permissions:
  allow_file_write: true
  allow_network: false
  sandbox_enabled: true
  max_file_size_mb: 50

knowledge_base:
  enabled: false
  scenario: writing
  auto_retrieve: false

examples:
  enabled: false
  max_examples: 0
  inject_to: frozen_zone

max_frozen_token: 4000

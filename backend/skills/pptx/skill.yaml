name: pptx
version: "1.0.0"
description: "PPT生成：使用 python-pptx 创建 .pptx 演示文稿，支持封面/目录/内容/图表/对比/结尾等页面类型，含5套配色方案和10/20/30设计法则。"
scenario: documents
author: "reasonix-community"
created_at: "2026-08-08"
enabled: true
model_scope: ["deepseek"]

dependencies:
  tools:
    - name: code_execution
      safety_level_override: safe
    - name: file_read
      safety_level_override: safe
    - name: file_write
      safety_level_override: elevated

permissions:
  allow_file_write: true
  allow_network: true
  sandbox_enabled: true
  max_file_size_mb: 50

knowledge_base:
  enabled: false
  scenario: documents
  auto_retrieve: false

examples:
  enabled: false
  max_examples: 0
  inject_to: frozen_zone

max_frozen_token: 4000

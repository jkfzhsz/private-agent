# ==============================================================================
# 私有化 Agent 开发方案 - 全局配置文件 (蓝图 §9.13)
# 对应章节:2.12 配置分层管理
# 规则:静态 yaml 默认值 + config_runtime 运行时覆盖(标注 [runtime] 的项支持)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 系统基础配置(2.1、2.2)
# ------------------------------------------------------------------------------
system:
  app_name: "Private Agent"
  version: "0.1.0"
  workspace_root: "${PA_USER_DATA}"         # 工作区根目录(打包版=userData, 程序/用户数据分离)
  sidecar:
    memory_limit_mb: 1536                  # Python Sidecar 内存上限 [runtime]
    log_level: "INFO"                      # 日志级别 [runtime]
  worker:
    pool_size: 2                           # Worker 进程池大小
    memory_limit_mb: 512                   # 单 Worker 内存上限

# ------------------------------------------------------------------------------
# 1c. Hooks 生命周期系统(阶段三批次2, 调研 round2 §4.2.2) [runtime]
# 默认空列表 = 行为不变(零回归)。每个 hook:
#   name: 唯一名; event: user_prompt_submit/pre_tool_use/post_tool_use/stop/
#                    pre_compact/permission_request
#   type: command(子进程, stdin JSON/stdout JSON) | http(回调 URL, 过 SSRF) |
#         mcp_tool(MCP 工具)
# 决策回写: permissionDecision(allow/deny/ask/defer) / updatedInput /
#           additionalContext / stop
# ------------------------------------------------------------------------------
hooks: []                                  # [runtime] 由设置页 admin CRUD 管理

# ------------------------------------------------------------------------------
# 2. 数据库配置(2.10、9.13)
# ------------------------------------------------------------------------------
database:
  host: "127.0.0.1"
  port: 5432
  name: "private_agent"
  user: "postgres"
  password_env: "PA_DB_PASSWORD"           # 密码从环境变量读取,不入 yaml
  pool_size: 10                            # asyncpg 连接池大小(蓝图 §2.10)

# ------------------------------------------------------------------------------
# 2. 通信协议配置(2.3)
# ------------------------------------------------------------------------------
server:
  http:
    host: "127.0.0.1"
    port: 8765                             # HTTP 控制面端口
  websocket:
    port: 8766                             # WS 数据面端口
    reconnect_interval_sec: 3              # 重连间隔
    event_buffer_size: 100                 # 事件缓冲区大小

# ------------------------------------------------------------------------------
# 3. 模型配置(2.7、2.9、2.12)
#
# V2 P3 去预置化: providers 不预置任何"指名道姓"的模型, 全量从设置页
# /config_runtime 管理(用户有什么模型就接什么, 统一 OpenAI 兼容协议)。
# 示例(从设置页添加, 勿在此硬编码):
#   providers:
#     my-llm:
#       base_url: "https://api.example.com/v1"
#       model_name: "my-model-1"
#       enabled: true
# ------------------------------------------------------------------------------
models:
  # 对话参数上限(设置页可手工调整, runtime > yaml)
  limits:
    # 方向二: context_window 决定压缩触发线(80%)。模型能力 128K 时
    # 配置 32768 → 触发线 ~26K, 压缩频率大幅下降; provider 级
    # context_window 可覆盖(models.providers.{name}.context_window)。
    context_window: 32768     # 原默认 8000 → 32K(压缩更晚触发)
    max_output_tokens: 4096   # 最大输出 tokens(单次模型响应, 原 2048)
    max_turns: 8              # 最大对话轮次(单轮对话内工具迭代上限, 原 20 → 8 防循环爆炸)
    # max_input_tokens 已废弃(从未被消费, 实际限制由 context_window 决定)

  router:
    type: "manual"                         # MVP: manual / V2: tag_based [runtime]
    # fallback_chain 由设置页添加 provider 时自动维护(runtime), 不在 yaml 写死

  # 压缩/评测模型按"模型名"匹配 providers(设置页配置的 model_name),
  # 不配置则压缩/评测功能优雅降级(不生效不崩溃)。
  compress_model: ""                       # [runtime]
  # 阶段三 S-1: compress_model 未配置时回退使用 fallback_chain 首选(主模型兼压缩),
  # 保证记忆提取/纠正沉淀可用; false 保持"无压缩模型即禁用"旧语义。
  compress_fallback_main: true             # [runtime]

# ------------------------------------------------------------------------------
# 4. 上下文工程配置(3.5、3.7、3.9、3.10、3.13)
# ------------------------------------------------------------------------------
context:
  # 项目优化(Hermes SOUL.md 借鉴): 稳定身份/协作规则段, 注入 system prompt 首位。
  # 留空使用代码内置默认(个人桌面智能体 + 协作规则); 自定义可覆盖。
  identity: ""  # [runtime]
  # 项目优化(opencode 借鉴): Doom Loop 死循环检测(工具反复调用提前终止)。
  loop:
    enabled: true  # [runtime] 整体开关(测试可关闭)
    max_warnings: 2  # [runtime] 提示多少次后仍循环则强制终止
    same_args_threshold: 3  # [runtime] 同参数重复 ≥3 次判定循环
    same_tool_threshold: 5  # [runtime] 最近 8 次中同工具 ≥5 次判定循环
  status_bar:
    enabled: true  # [runtime]
    inject_per_turn: true  # [runtime]
    # 方向三: 状态栏注入频率(迭代粒度)。1=每迭代(原行为); 3=每 3 迭代 1 次
    inject_every_iterations: 3  # [runtime]
  # 方向三: 知识库片段注入精简
  kb:
    injection:
      enabled: true     # false = 完全关闭 KB 片段注入
      max_chars: 6000   # 单条截断字符数(原硬编码 12000 → 6000)
  # 方向三: 记忆注入精简
  memory:
    max_item_chars: 300  # 单条记忆最大字符(超出截断, 默认不截=None)
  template:
    kb_replace_mode: false  # [runtime]
  compression:
    # active_zone_token_limit 已废弃(从未被消费, 实际触发线由
    # models.limits.context_window × 0.8 决定, 方向二)
    stable_zone_size_limit: 20  # [runtime]
    aggressive_mode: false  # [runtime]
    kb_chunks_merge_threshold: 20  # [runtime]
  billing:
    currency: "CNY"  # [runtime]
    price_snapshot_enabled: true  # [runtime]

# ------------------------------------------------------------------------------
# 5. 记忆配置(4.2、4.4、4.5)
# ------------------------------------------------------------------------------
memory:
  extract_interval_turns: 8  # [runtime]
  inject_limit: 10  # [runtime]
  # 0.5.0 M1(2026-08-08): 注入配额 —— 全局只注入"身份+核心偏好"画像,
  # 其余配额全给场景记忆(用户确认默认 2:8)。global_n 取 min(global_n, limit//2)
  # 保证场景至少占一半; 全局其他内容按需检索(memory_search/search_knowledge)。
  inject_ratio:  # [runtime]
    global: 2
    scene: 8
  # 0.5.0 M3 B3: 驱逐前巩固归档(摘要入 user_memories_archive 再 deactivate)
  archive_before_evict: true  # [runtime]
  eviction:  # [runtime]
    max_active_count: 200
    min_importance_threshold: 0.3
    expire_days: 30

# ------------------------------------------------------------------------------
# 6. 知识库配置(4.9、4.10、4.11、4.13)
# ------------------------------------------------------------------------------
kb:
  chunk:
    markdown:
      chunk_size: 512
      chunk_overlap: 64
    code:
      chunk_size: 256
      chunk_overlap: 32
    pdf:
      chunk_size: 512
      chunk_overlap: 64
    plain:
      chunk_size: 400
      chunk_overlap: 50
  embedding:
    # 0.5.1: 固定 bge-small-zh-v1.5(512 维, ModelScope 官方) —— 本机 7.6GB 内存下 bge-m3 OOM;
    # padding 至 storage_dim(1024) 与 DB vector(1024) 对齐。
    # C3 单一模型纪律: 切换模型 = 全量重灌, 由启动自检程序强制, 勿运行时改。    local_default: "BAAI/bge-small-zh-v1.5"
    local_light: "BAAI/bge-small-zh-v1.5"  # [runtime]
    # 模型本地路径(直接模型目录: ModelScope 官方 BAAI/bge-small-zh-v1.5,
    # 512 维, 2026-08-09 下载至 kb-model-cache/modelscope)。
    # 显式指定时优先于自动探测(项目根误标目录会干扰探测)。
    model_path: "D:/Private agent/kb-model-cache/modelscope/models/BAAI--bge-small-zh-v1.5/snapshots/master"  # [runtime]
    # DB 存储维(补零占位), 与 schema.sql vector(1024) 一致, 勿改
    storage_dim: 1024
    # V2 P3 去预置化: 云端 embedding 兜底按模型名匹配 providers, 空则禁用
    fallback_cloud: ""
    auto_switch_memory_gb: 6  # [runtime] 已废弃(C3 固定模型), 保留字段兼容
    lru_cache_size: 512
  hnsw:
    m: 16
    ef_construction: 128
    ef_search: 64  # [runtime]
  retrieval:
    rrf_k: 60
    vector_top_k: 20
    keyword_top_k: 20
    final_top_k: 5
  query_rewrite:
    # 2026-08-15(M2 P2-14): 查询重写 —— 检索前启发式多查询扩展
    # (去停用词核心词/短语合并变体), 提升召回精度。
    # enabled=false(默认): 行为与旧版完全一致, 零成本零风险;
    # enabled=true: 检索前对扩展查询分别检索 → 合并去重 → 统一重排。
    enabled: false  # [runtime]
    max_expansions: 3  # [runtime] 扩展查询总数上限(含原查询)

# ------------------------------------------------------------------------------
# 7. 工具层配置(5.4、5.12、5.13、5.15)
# ------------------------------------------------------------------------------
tools:
  mcp:
    config_source: "hybrid"  # [runtime]
    probe_interval_sec: 60  # [runtime]
    servers: []  # MCP 服务声明列表:每项含 id/type/command/args/tags/timeout;http 类型含 url(MCP 端点, 如 http://host:port/mcp)
    # MCP 2026-07-28 无状态协议(Phase 2 协议升级): 移除握手/会话, 请求带 _meta + MCP-Protocol-Version/Mcp-Method/Mcp-Name 头
    protocol_version: "2026-07-28"  # [runtime] 支持: 2026-07-28(无状态,默认) | 2025-11-25(旧有状态,兼容)
    cache_ttl_ms: 30000  # [runtime] V2 启用
    enable_server_discover: true  # [runtime] 2026-07-28 server/discover 能力探测
    # 对话流畅度优化(方向一): skill → MCP server 绑定。
    # 会话激活某 skill 时只装配绑定列表内的 server(支持 * 通配),
    # 工具池从全量收敛到 skill 相关子集; 未列出的 skill 装配全部(兼容旧行为)。
    # 注意: 绑定不宜过窄 —— 工作模式也常问行情/新闻, 故 office 保留常用金融 MCP。
    # V1.5.1(2026-08-07 修复): 记忆(mempalace)/搜索(Searchpin)是跨模式通用
    # 能力, 三个模式全部装配 —— 修复 "LLM 调用 mempalace/Searchpin 返回空"
    # 的装配层根因(此前 office 两工具均不装配, data_analysis 缺 Searchpin,
    # 模型看不到工具自然返回空)。
    # 0.5.0 M1(2026-08-08): 子瞻(office)保留 ifind 金融系(工作与金融相关,
    # 用户确认) —— office 与 data_analysis 均为 hexin-ifind-ds-* 全系,
    # 职责边界靠 scene_profile 规则约束; frontend_design(清和) 通用。
    skill_binding:
      office: ["hexin-ifind-ds-*", "mempalace", "Searchpin"]
      data_analysis: ["hexin-ifind-ds-*", "mempalace", "Searchpin"]
      frontend_design: ["mempalace", "Searchpin"]
    # 2026-08-13 类型感知限流(方案 §4.3): 进程级 MCP 请求类型并发上限。
    # MCP client 是进程级单例(全会话共享同一 Searchpin 子进程), ReactLoop 级
    # Semaphore(concurrent_limit=5) 无法防多会话并发打爆通道。search 类(web_search/
    # Searchpin)访问外部网站, 反爬敏感, 全局并发压到 1 —— 既防管道拥挤也防网站限流。
    type_limits:
      search: 1
      analysis: 3
      code: 3
      other: 5
  # 对话流畅度优化(方向一): 每轮动态 top-N 工具注入(避免全量 schema)
  tool_selection:
    enabled: true
    strategy: "keyword_score"  # 关键词/描述匹配(确定性)
    top_n: 15                  # 每轮注入上限(工具 schema ~2-3k token)
    min_pool_size: 8           # 池内工具 ≤ 8 时全量注入(小池无需裁剪)
    always_include:            # 锚点: 无条件注入(支持 fnmatch 通配, V1.5.1)
      - "code_execution"
      - "file_read"
      - "file_write"
      # V1.5.1: 记忆/搜索整组工具无条件注入 —— 修复 top-15 竞争把
      # mempalace_search/mempalace_kg_query 挤出模型可见集 → LLM 返回空
      - "mcp__mempalace__*"
      - "mcp__Searchpin__*"
      # 0.5.0 M1: 记忆按需检索(全局其他内容/归档召回)无条件注入
      - "memory_search"
  web_search:
    backend: "duckduckgo"  # duckduckgo(国际,无 key) | bocha(已停用) | bing(HTML 解析, 当前默认 .env)
    # 外部服务统一从前端接入(MCP), 专用搜索 API(如 bocha)不再后端配置
  permission:
    cache_ttl_sec: 3600  # [runtime]
    elevated_require_ws_confirm: true  # [runtime]
  timeout:
    default_sec: 30  # [runtime]
    categories:  # [runtime]
      file_ops: 30
      http_request: 60
      web_search: 30
      code_execution: 300
      search_knowledge: 10
      delegate_subtask: 1860  # V1.5 项-1: 委派工具兜底上限。2026-08-13 修复:
                              # 原 300s 与 max_total_lifetime(300s) 同值且过短, 误杀
                              # 心跳正常的慢任务(搜索类 20+ 次检索 300s 不够), 且 wait_for
                              # 先于 lifetime 到点走了粗暴 cancel 路径(拖死 MCP 通道)。
                              # 现设为 1860s(31min) > max_total_lifetime(1800s), 让心跳
                              # 机制 + lifetime 优雅判定先行, wait_for 仅作最后保险丝。
    max_retries: 3
    backoff_base_sec: 1
  # V1.5 项-1 子代理/任务委派(ADR-012 §3.3(f) 配置项, [runtime])
  subagent:
    heartbeat_interval_sec: 10   # 心跳周期(子代理侧独立心跳 task)
    heartbeat_timeout_sec: 90    # 无心跳判 stale 阈值(> 单次模型/工具调用上限)
    heartbeat_poll_sec: 5        # watchdog 轮询间隔(delegate handler 轮询式 wait)
    grace_sec: 30                # stale 后宽限窗口(自 stalled_at 起算, 非最后心跳)
    max_total_lifetime_sec: 1800  # 子代理最大总生命周期硬上限。2026-08-13 修复:
                                  # 原 300s 误杀心跳正常的长任务(搜索类任务 300s 不够,
                                  # 心跳机制本应"慢但活着不误判")。放宽到 30min, 仅作
                                  # 防御心跳 bug 死循环的最后兜底, 真死判定交给心跳超时
                                  # (stalled→grace→kill)。
    max_parallel: 3              # 单轮委派子代理数上限
    max_nesting_depth: 2         # 嵌套深度上限(M2: 子代理不注入 delegate 工具 → 实际 1)
    cancel_wait_sec: 5           # cancel 后等待任务退出的窗口期(zombie 判定)
    max_restarts: 0              # 自动重启次数上限(M4, 默认关)
  artifact:
    truncate_threshold_tokens: 4000
    sandbox_truncate_threshold_tokens: 2000

# ------------------------------------------------------------------------------
# 8. 沙箱配置(6.7、6.14)
# ------------------------------------------------------------------------------
sandbox:
  enabled: true  # [runtime]
  workspace_root: "${PA_USER_DATA}/.sandbox"
  retention_days: 7  # [runtime]
  languages:
    python:
      command: "python"
      script_extension: ".py"
      min_version: "3.10"
    javascript:
      command: "node"
      script_extension: ".js"
      min_version: "18.0"
  limits:  # [runtime]
    cpu_timeout_sec: 300
    memory_limit_mb: 512
    disk_limit_mb: 100
    network_enabled: false
  security:
    code_scan_enabled: true  # [runtime]
    env_sanitization_enabled: true  # [runtime]
    dangerous_patterns:
      - "os\\.system"
      - "subprocess\\.Popen"
      - "pty\\.spawn"
      - "os\\.fork"

# ------------------------------------------------------------------------------
# 9. Skills 配置(7.2、7.6)
# ------------------------------------------------------------------------------
skills:
  storage:
    dev_dir: "${PA_USER_DATA}/skills"
    runtime_source: "db_first"  # [runtime]
  defaults:
    max_frozen_token: 4000  # [runtime]
    examples_count: 3

# ------------------------------------------------------------------------------
# 10. 评估配置(8.8、8.9)
# ------------------------------------------------------------------------------
eval:
  # V2 P3 去预置化: judge 模型按模型名匹配 providers, 空则评测降级
  judge_model: ""  # [runtime]
  judge_prompt_dir: "./config/judge_prompts"
  datasets_per_scenario: 20  # [runtime]
  regression_subset: 5  # [runtime]
  auto_trigger_on_version_change: true  # [runtime]

# ------------------------------------------------------------------------------
# 11. 可观测性配置(2.10、2.13)
# ------------------------------------------------------------------------------
observability:
  logging:
    level: "INFO"  # [runtime]
    file_path: "${PA_USER_DATA}/logs/agent.log"
    stdout_enabled: true  # [runtime]
    trace_id_enabled: true
  disk:
    warning_gb: 1.5  # [runtime]
    block_new_session_gb: 2.0  # [runtime]
    force_cleanup_gb: 3.0  # [runtime]
    react_events_retention_days: 30  # [runtime] 默认 30 天(蓝图 §2.10 第 2 条);3GB 强制清理时收紧为 7 天
    react_events_retention_days_force: 7  # 3GB 强制清理时收紧值(蓝图 §2.10 第 6 条)
    messages_archive_retention_days: 90  # 蓝图 §2.10 第 3 条:会话关闭 90 天后归档
    vacuum_schedule: "0 3 * * 0"

# ------------------------------------------------------------------------------
# 注入防护配置(B3 P0-2,蓝图 §3.12)
# ------------------------------------------------------------------------------
injection_guard:
  enabled: true  # [runtime] 关闭则跳过全部注入扫描与截断

# ------------------------------------------------------------------------------
# 安全硬边界(阶段二批次 1: 审查 A.3.10/B.2.1)
# ------------------------------------------------------------------------------
security:
  cors:
    # admin 控制面允许的跨域来源白名单(浏览器 dev 场景必须显式列出);
    # Electron 生产 origin 为 app://.(或 file://, 无 Origin 头则不触发 CORS)
    allow_origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:4173"
      - "http://127.0.0.1:4173"
      - "app://."
    # dev 模式放宽: PA_ENV=dev(vite 端口占用自动切换)时放行 localhost 任意端口
    dev_wildcard: true
  ssrf:
    # 阶段二批次 2 实施(http_request 等出网工具的 SSRF 防护)
    enabled: true
    allow_private: false
    max_response_bytes: 2097152

# ------------------------------------------------------------------------------
# 12. 自进化配置(Phase 1-2, 2026-08-11)
# ------------------------------------------------------------------------------
evolution:
  injection:
    max_lessons: 3   # 经验注入条数上限(importance 降序取 top-N)
    max_tokens: 500  # 经验注入总 token 预算(修订 4)
  reflection:
    enabled: true  # 反思引擎开关(false → ReactLoop 反思+经验沉淀零回归)



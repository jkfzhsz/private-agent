[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "private-agent"
version = "0.1.0"
description = "Private Agent - 单人本地 Electron 桌面 Agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "asyncpg>=0.29",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
office = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "matplotlib>=3.8",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]
data_analysis = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
]
frontend_design = [
    "jinja2>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["private_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
